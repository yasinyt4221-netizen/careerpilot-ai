services:
  - type: web
    name: careerpilot-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CORS_ORIGINS
        value: https://yasinyt4221-netizen.github.io
      - key: PUBLIC_DEMO_ONLY
        value: 'false'
      - key: HOSTED_MODE
        value: 'true'
      - key: APP_ACCESS_CODE
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SEMANTIC_ENABLED
        value: 'false'
