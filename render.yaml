services:
  - type: web
    name: careerpilot-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python prepare_semantic_model.py
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CORS_ORIGINS
        value: https://yasinyt4221-netizen.github.io
      - key: PUBLIC_DEMO_ONLY
        value: 'true'
      - key: SEMANTIC_ENABLED
        value: 'true'
